[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D SMARTTRACK_MODEM_ENABLED=0
  -D SMARTTRACK_SD_CS_PIN=-1
  -D SMARTTRACK_MODEM_PWRKEY_PIN=-1
  -Wall
  -Wextra
  -Werror=return-type
lib_ldf_mode = chain+
