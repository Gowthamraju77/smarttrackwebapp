[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarttrack-ml"
version = "0.1.0"
description = "Fail-closed SmartTrack telemetry reliability scoring service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "scikit-learn>=1.4",
]

[project.scripts]
smarttrack-ml-train = "smarttrack_ml.train:main"

[tool.setuptools.packages.find]
where = ["."]
